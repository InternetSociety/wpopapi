[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jose", "rasterio", "rasterio.*", "shapely", "shapely.*", "markdown"]
ignore_missing_imports = true
