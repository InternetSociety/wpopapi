{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="mb-4">WorldPop Population API</h1>
    {% if current_user %}
    <p>Signed in as <strong>{{ current_user.email }}</strong>.</p>
    <p><a class="btn btn-primary" href="/docs">Open API documentation</a></p>
    {% else %}
    {% if error %}
    <div class="alert alert-danger" role="alert">
      The email or password is incorrect, or the account is inactive.
    </div>
    {% endif %}
    <div class="card">
      <div class="card-body">
        <h2 class="h5 card-title mb-3">Sign in</h2>
        <form action="/login" method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input id="username" name="username" type="email" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" minlength="8" maxlength="128" required>
          </div>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
      </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
