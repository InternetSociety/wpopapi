<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">{{ app_name }}</a>
      {% if current_user %}
      <ul class="navbar-nav ms-auto flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="/docs">API</a></li>
        <li class="nav-item"><a class="nav-link" href="/app-docs">Guide</a></li>
        <li class="nav-item"><a class="nav-link" href="/manage-users">Users</a></li>
        {% if current_user.is_admin %}
        <li class="nav-item"><a class="nav-link" href="/tile-cache">Tile Cache</a></li>
        {% endif %}
        <li class="nav-item">
          <form action="/logout" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-link nav-link">Sign out</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </div>
  </nav>
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
