{% extends "base.html" %}
{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <h1 class="mb-4">Reset password</h1>
  {% if submitted %}
  <div class="alert alert-success" role="alert">If the account is eligible, a password-reset code has been sent.</div>
  {% else %}
  <form action="/forgot-password" method="post" class="card card-body">
    <label for="email" class="form-label">Email</label>
    <input id="email" name="email" type="email" class="form-control mb-3" autocomplete="email" maxlength="320" required>
    <button type="submit" class="btn btn-primary">Send reset code</button>
  </form>
  {% endif %}
</div></div>
{% endblock %}
