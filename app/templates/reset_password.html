{% extends "base.html" %}
{% block title %}Choose password · {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <h1 class="mb-4">Choose a new password</h1>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form action="/reset-password" method="post" class="card card-body">
    <label for="code" class="form-label">Reset code</label>
    <input id="code" name="code" type="text" class="form-control mb-3" autocomplete="one-time-code" required>
    <label for="password" class="form-label">New password</label>
    <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="new-password" minlength="{{ password_min_length }}" maxlength="{{ password_max_length }}" required>
    <button type="submit" class="btn btn-primary">Reset password</button>
  </form>
</div></div>
{% endblock %}
